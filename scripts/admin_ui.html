<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>官网工作台 · 东方隐侠</title><link rel="stylesheet" href="/admin.css"></head>
<body>
<aside class="sidebar" id="sidebar">
  <a class="brand" href="#home"><img src="/assets/logo-mark.png" alt=""><span>东方隐侠<small>官网工作台</small></span></a>
  <nav id="navigation" aria-label="后台栏目"></nav>
  <div class="sidebar-bottom"><a href="http://127.0.0.1:4018/" target="_blank" rel="noopener">本地官网 ↗</a><a href="https://eastsword.github.io/" target="_blank" rel="noopener">线上官网 ↗</a><a href="/editor">文章专注编辑 ↗</a><span class="local-status">本机运行</span></div>
</aside>
<main>
  <header class="topbar"><div class="panel-controls"><button id="toggle-navigation" class="icon" aria-controls="sidebar" aria-expanded="true" aria-label="收起导航栏" title="收起导航栏">☰</button><button id="toggle-records" class="icon" aria-controls="record-panel" aria-expanded="true" aria-label="收起文章列表" title="收起文章列表">‹</button></div><div class="page-heading"><span id="breadcrumb">内容管理</span><h1 id="page-title">首页编排</h1></div><div class="actions" id="doc-actions"><span id="save-state" role="status">已加载</span><button id="delete-draft" hidden>删除草稿</button><button id="discard" title="放弃此份草稿">恢复磁盘版本</button><button id="save">保存草稿</button><button id="preview" class="primary">预览</button><button id="apply">写入官网</button></div></header>
  <div id="workspace">
    <aside class="record-panel" id="record-panel"><div class="record-tools"><input id="search" type="search" placeholder="搜索内容" aria-label="搜索内容"><button id="new" class="icon" title="新建内容" aria-label="新建内容">+</button></div><div id="records"></div></aside>
    <section class="editor-pane" id="editor-pane"><div class="editor-tabs"><button class="active" id="form-tab">内容</button><button id="raw-tab">源数据</button><span id="draft-badge"></span></div><div id="form"></div><textarea id="raw" hidden spellcheck="false" aria-label="源数据 JSON"></textarea></section>
    <aside class="preview-pane" id="preview-pane"><div class="preview-toolbar"><strong>官网预览</strong><div class="segmented" id="devices"><button data-width="1440" class="active" title="电脑预览">电脑</button><button data-width="768" title="平板预览">平板</button><button data-width="390" title="手机预览">手机</button></div><a id="open-preview" target="_blank" rel="noopener" title="新窗口打开预览">↗</a></div><div id="preview-empty">尚未构建预览</div><div id="preview-viewport" hidden><iframe title="官网真实页面预览" id="preview-frame" sandbox="allow-scripts allow-same-origin allow-popups allow-forms"></iframe></div></aside>
  </div>
  <section id="special" hidden></section>
</main>
<dialog id="modal"><div class="dialog-head"><h2 id="modal-title"></h2><button id="close-modal" class="icon" title="关闭" aria-label="关闭">×</button></div><div id="modal-body"></div></dialog>
<div id="toast" role="status" hidden></div>
<script src="/admin_format.js" defer></script>
<script src="/admin.js" defer></script>
</body></html>
