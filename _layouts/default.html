<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header class="site">
    <div class="wrap">
      <div class="brand">{{ site.title }}<span class="cursor">_</span></div>
      <div class="tagline">{{ site.tagline }}</div>
      <nav>
        <a href="{{ '/' | relative_url }}">// 话题索引</a>
        <a href="{{ '/#about' | relative_url }}">// 关于</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="site">
    <div class="wrap">
      EASTERN-RONIN SEC · DFYX-SEC TEAM<br>
      <a href="https://github.com/EastSword" target="_blank" rel="noopener">GITHUB // EASTSWORD</a><br>
      © 2026 — 追踪攻击面的每一次迁移
    </div>
  </footer>
</body>
</html>
