<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  <link rel="icon" type="image/x-icon" href="{{ '/assets/favicon.ico' | relative_url }}">
</head>
<body>
  <nav class="nav">
    <div class="inner">
      <a class="brand" href="{{ '/' | relative_url }}"><img class="logo" src="{{ '/assets/logo-mark.png' | relative_url }}" alt="东方隐侠">东方<span>隐侠</span></a>
      <div class="links">
        <a href="{{ '/' | relative_url }}#topics">研究话题</a>
        <a href="{{ '/' | relative_url }}#about">关于团队</a>
        <a href="https://github.com/EastSword" target="_blank" rel="noopener">GitHub</a>
      </div>
    </div>
  </nav>

  {{ content }}

  <footer class="site">
    <div class="wrap">
      <div class="inner">
        <div>
          <div class="seal">东方隐侠</div>
          DFYX-SEC · 追踪攻击面的每一次迁移
        </div>
        <div style="text-align:right;">
          <a href="https://github.com/EastSword" target="_blank" rel="noopener">GITHUB // EASTSWORD</a><br>
          © 2026 东方隐侠安全团队
        </div>
      </div>
    </div>
  </footer>
</body>
</html>
