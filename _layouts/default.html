  <!-- 视频号弹窗：sph ID 仅微信内可搜，外部浏览器无法直接跳转 -->

    <div class="wx-panel" role="dialog" aria-label="视频号添加指引">

    </div>

  <script>
  (function () {
    var list = document.getElementById('topic-list');
    if (!list) return;
    var tiles = Array.prototype.slice.call(list.querySelectorAll('.tile'));
    var search = document.getElementById('topic-search');
    var chips = document.getElementById('tag-chips');
    var pager = document.getElementById('pager');
    var empty = document.getElementById('empty-result');
    var PER_PAGE = 6;
    var state = { q: '', tag: '__all', page: 1 };

    function norm(s) { return (s || '').toLowerCase().trim(); }

    function filtered() {
      return tiles.filter(function (t) {
        var tags = (t.getAttribute('data-tags') || '').split(',');
        if (state.tag !== '__all' && tags.indexOf(state.tag) === -1) return false;
        if (state.q) {
          var hay = norm([t.getAttribute('data-title'), t.getAttribute('data-subtitle'),
                          t.getAttribute('data-keyword'), tags.join(' ')].join(' '));
          if (hay.indexOf(norm(state.q)) === -1) return false;
        }
        return true;
      });
    }

    function render() {
      var items = filtered();
      var pages = Math.max(1, Math.ceil(items.length / PER_PAGE));
      if (state.page > pages) state.page = pages;
      var start = (state.page - 1) * PER_PAGE;

      tiles.forEach(function (t) { t.style.display = 'none'; });
      items.slice(start, start + PER_PAGE).forEach(function (t) { t.style.display = ''; });
      empty.hidden = items.length !== 0;

      if (pages <= 1) { pager.innerHTML = ''; return; }
      var html = '';
      if (state.page > 1) html += '<button data-go="' + (state.page - 1) + '">‹</button>';
      for (var i = 1; i <= pages; i++) {
        html += '<button data-go="' + i + '"' + (i === state.page ? ' class="cur"' : '') + '>' + i + '</button>';
      }
      if (state.page < pages) html += '<button data-go="' + (state.page + 1) + '">›</button>';
      pager.innerHTML = html;
    }

    if (search) {
      search.addEventListener('input', function () { state.q = search.value; state.page = 1; render(); });
    }
    if (chips) {
      chips.addEventListener('click', function (e) {
        var b = e.target.closest('.chip');
        if (!b) return;
        chips.querySelectorAll('.chip').forEach(function (c) { c.classList.remove('active'); });
        b.classList.add('active');
        state.tag = b.getAttribute('data-tag');
        state.page = 1;
        render();
      });
    }
    if (pager) {
      pager.addEventListener('click', function (e) {
        var b = e.target.closest('button[data-go]');
        if (!b) return;
        state.page = parseInt(b.getAttribute('data-go'), 10);
        render();
        var top = document.getElementById('topics').getBoundingClientRect().top + window.pageYOffset - 90;
        window.scrollTo({ top: top, behavior: 'smooth' });
      });
    }
    render();
  })();
  </script>
  <script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
  <script>
  (function () {
    var modal = document.getElementById('wx-modal');
    if (!modal) return;
    var WX_ID = 'sphLfLFD0AYIAxQ';

    function openModal() { modal.hidden = false; document.body.style.overflow = 'hidden'; }
    function closeModal() { modal.hidden = true; document.body.style.overflow = ''; }

    var link = document.getElementById('wx-channel-link');
    if (link) link.addEventListener('click', openModal);
    modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(); });
    var closeBtn = modal.querySelector('.wx-close');
    if (closeBtn) closeBtn.addEventListener('click', closeModal);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !modal.hidden) closeModal(); });

    var copy = document.getElementById('wx-copy');
    if (copy) copy.addEventListener('click', function () {
      function done() {
        copy.textContent = '已复制 ✓'; copy.classList.add('ok');
        setTimeout(function () { copy.textContent = '复制 ID'; copy.classList.remove('ok'); }, 1600);
      }
      function fallback() {
        var ta = document.createElement('textarea');
        ta.value = WX_ID; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); done(); } catch (err) {}
        document.body.removeChild(ta);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(WX_ID).then(done, fallback);
      } else fallback();
    });
  })();
  </script>
  <script>
  (function () {
    var mount = document.getElementById('giscus-mount');
    if (!mount) return;
    var loaded = false;

    function loadWall() {
      if (loaded) return;
      loaded = true;
      var s = document.createElement('script');
      s.src = 'https://giscus.app/client.js';
      s.async = true;
      s.crossOrigin = 'anonymous';
      s.setAttribute('data-repo', 'EastSword/EastSword.github.io');
      s.setAttribute('data-repo-id', 'R_kgDOINsDXg');
      s.setAttribute('data-category', 'General');
      s.setAttribute('data-category-id', 'DIC_kwDOINsDXs4DEYFm');
      s.setAttribute('data-mapping', 'specific');
      s.setAttribute('data-term', '江湖留名 · 粉丝签名墙');
      s.setAttribute('data-strict', '1');
      s.setAttribute('data-reactions-enabled', '1');
      s.setAttribute('data-emit-metadata', '0');
      s.setAttribute('data-input-position', 'top');
      s.setAttribute('data-theme', 'https://eastsword.github.io/assets/giscus-theme.css');
      s.setAttribute('data-lang', 'zh-CN');
      mount.appendChild(s);

      var timer = setInterval(function () {
        if (mount.querySelector('iframe')) {
          clearInterval(timer);
          var l = document.getElementById('wall-loading');
          if (l) l.remove();
        }
      }, 400);
      setTimeout(function () { clearInterval(timer); }, 30000);
    }

    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (entries) {
        if (entries.some(function (e) { return e.isIntersecting; })) {
          io.disconnect();
          loadWall();
        }
      }, { rootMargin: '300px' });
      io.observe(mount);
    } else {
      loadWall();
    }
  })();
  </script>
