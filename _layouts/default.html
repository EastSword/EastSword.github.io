<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  <link rel="icon" type="image/x-icon" href="{{ '/assets/favicon.ico' | relative_url }}">
</head>
<body>
  <nav class="nav">
    <div class="inner">
      <a class="brand" href="{{ '/' | relative_url }}"><img class="logo" src="{{ '/assets/logo-mark.png' | relative_url }}" alt="东方隐侠安全团队">东方隐侠安全团队</a>
      <div class="links">
        <a href="{{ '/' | relative_url }}#topics">研究话题</a>
        <a href="{{ '/' | relative_url }}#about">关于团队</a>
        <a href="https://github.com/EastSword" target="_blank" rel="noopener">GitHub</a>
      </div>
    </div>
  </nav>

  {{ content }}

  <footer class="site">
    <div class="wrap">
      <div class="inner">
        <div>
          <div class="seal">东方隐侠</div>
          DFYX-SEC · 追踪攻击面的每一次迁移
        </div>
        <div class="social">
          <a href="https://wittpeng.blog.csdn.net/" target="_blank" rel="noopener">CSDN</a>
          <span class="sep">/</span>
          <a href="https://space.bilibili.com/1565697864" target="_blank" rel="noopener">Bilibili</a>
          <span class="sep">/</span>
          <a href="https://wx.zsxq.com/group/51115811242514" target="_blank" rel="noopener">知识星球</a>
          <span class="sep">/</span>
          <a href="https://github.com/EastSword" target="_blank" rel="noopener">GitHub</a>
        </div>
        <div style="text-align:right;">
          © 2026 东方隐侠安全团队
        </div>
      </div>
    </div>
  </footer>
  <script>
  (function () {
    var list = document.getElementById('topic-list');
    if (!list) return;
    var tiles = Array.prototype.slice.call(list.querySelectorAll('.tile'));
    var search = document.getElementById('topic-search');
    var chips = document.getElementById('tag-chips');
    var pager = document.getElementById('pager');
    var empty = document.getElementById('empty-result');
    var PER_PAGE = 6;
    var state = { q: '', tag: '__all', page: 1 };

    function norm(s) { return (s || '').toLowerCase().trim(); }

    function filtered() {
      return tiles.filter(function (t) {
        var tags = (t.getAttribute('data-tags') || '').split(',');
        if (state.tag !== '__all' && tags.indexOf(state.tag) === -1) return false;
        if (state.q) {
          var hay = norm([t.getAttribute('data-title'), t.getAttribute('data-subtitle'),
                          t.getAttribute('data-keyword'), tags.join(' ')].join(' '));
          if (hay.indexOf(norm(state.q)) === -1) return false;
        }
        return true;
      });
    }

    function render() {
      var items = filtered();
      var pages = Math.max(1, Math.ceil(items.length / PER_PAGE));
      if (state.page > pages) state.page = pages;
      var start = (state.page - 1) * PER_PAGE;

      tiles.forEach(function (t) { t.style.display = 'none'; });
      items.slice(start, start + PER_PAGE).forEach(function (t) { t.style.display = ''; });
      empty.hidden = items.length !== 0;

      if (pages <= 1) { pager.innerHTML = ''; return; }
      var html = '';
      if (state.page > 1) html += '<button data-go="' + (state.page - 1) + '">‹</button>';
      for (var i = 1; i <= pages; i++) {
        html += '<button data-go="' + i + '"' + (i === state.page ? ' class="cur"' : '') + '>' + i + '</button>';
      }
      if (state.page < pages) html += '<button data-go="' + (state.page + 1) + '">›</button>';
      pager.innerHTML = html;
    }

    if (search) {
      search.addEventListener('input', function () { state.q = search.value; state.page = 1; render(); });
    }
    if (chips) {
      chips.addEventListener('click', function (e) {
        var b = e.target.closest('.chip');
        if (!b) return;
        chips.querySelectorAll('.chip').forEach(function (c) { c.classList.remove('active'); });
        b.classList.add('active');
        state.tag = b.getAttribute('data-tag');
        state.page = 1;
        render();
      });
    }
    if (pager) {
      pager.addEventListener('click', function (e) {
        var b = e.target.closest('button[data-go]');
        if (!b) return;
        state.page = parseInt(b.getAttribute('data-go'), 10);
        render();
        var top = document.getElementById('topics').getBoundingClientRect().top + window.pageYOffset - 90;
        window.scrollTo({ top: top, behavior: 'smooth' });
      });
    }
    render();
  })();
  </script>
</body>
</html>
