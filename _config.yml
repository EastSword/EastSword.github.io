title: 东方隐侠安全团队
tagline: 研究 AI 如何安全地进入真实工作
description: 千里与东方隐侠安全团队的研究档案：AI 应用安全、身份与软件供应链的原创研究、工程方法与精选外部资料。
url: https://eastsword.github.io

exclude: [scripts, docs, README.md]  # 编辑、验证脚本与内部内容规划不进入公开产物

plugins:
  - jekyll-sitemap   # 自动生成 sitemap.xml（GitHub Pages 原生支持）
  - jekyll-feed      # 自动生成技术文章 RSS：/feed/articles.xml

feed:
  collections:
    - articles

markdown: kramdown
future: true # date 是话题创建时间元数据，不做定时发布；否则 UTC 未到当天的话题页会被跳过
collections:
  topics:
    output: true
    permalink: /topics/:name/
  articles:
    output: true
    permalink: /articles/:name/
  resources:          # 精选外部资料（官方规范/标准/论文/工具/事件复盘），不产出页面，只作数据供课题页与 /topics/ 聚合
    output: false
kramdown:
  auto_ids: true
