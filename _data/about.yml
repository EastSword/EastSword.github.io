paragraphs:
  - 安全 BP，做 Web 安全和业务安全多年，现在盯 AI 应用里的身份、委托权限、供应链和执行边界。本站课题从选题、做实验到成文，都出自我的手。
  - AI 会读代码、连业务系统、替人执行任务，哪个环节管得住、哪个环节容易出事，一个个测。研究跟着实际工作流走：测过的写结论，没测透的标待验证，不编故事。
