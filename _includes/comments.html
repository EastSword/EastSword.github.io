<section class="comments-block {% if include.width == 'article' %}comments-article{% endif %}">
  <div class="comments-head">
    <h2>留言讨论</h2>
    <a class="admin-link" href="https://github.com/EastSword/EastSword.github.io/discussions" target="_blank" rel="noopener" title="仓库所有者可在 GitHub 上管理评论">评论管理</a>
  </div>
  <p class="comments-hint">以 GitHub 身份留言，本页评论独立成串，支持表情回应。</p>
  <div class="wall-frame comments-frame">
    <div class="giscus-mount" id="comments-mount"></div>
    <div class="wall-loading" id="comments-loading"><span class="glyph">论</span><span>评论区展开中…</span></div>
  </div>
</section>

<script>
(function () {
  var mount = document.getElementById('comments-mount');
  if (!mount) return;
  var loaded = false;

  function loadComments() {
    if (loaded) return;
    loaded = true;
    var s = document.createElement('script');
    s.src = 'https://giscus.app/client.js';
    s.async = true;
    s.crossOrigin = 'anonymous';
    s.setAttribute('data-repo', 'EastSword/EastSword.github.io');
    s.setAttribute('data-repo-id', 'R_kgDOINsDXg');
    s.setAttribute('data-category', 'General');
    s.setAttribute('data-category-id', 'DIC_kwDOINsDXs4DEYFm');
    s.setAttribute('data-mapping', 'pathname');
    s.setAttribute('data-strict', '1');
    s.setAttribute('data-reactions-enabled', '1');
    s.setAttribute('data-emit-metadata', '0');
    s.setAttribute('data-input-position', 'top');
    s.setAttribute('data-theme', 'https://eastsword.github.io/assets/giscus-theme.css');
    s.setAttribute('data-lang', 'zh-CN');
    mount.appendChild(s);

    var timer = setInterval(function () {
      if (mount.querySelector('iframe')) {
        clearInterval(timer);
        var l = document.getElementById('comments-loading');
        if (l) l.remove();
      }
    }, 400);
    setTimeout(function () { clearInterval(timer); }, 30000);
  }

  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (entries) {
      if (entries.some(function (e) { return e.isIntersecting; })) {
        io.disconnect();
        loadComments();
      }
    }, { rootMargin: '300px' });
    io.observe(mount);
  } else {
    loadComments();
  }
})();
</script>
